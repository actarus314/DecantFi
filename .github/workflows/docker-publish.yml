name: Publish image

# ⚠ `build-check` is a REQUIRED check, so its job name must not move — and that rules out a
# `strategy.matrix` on it: a matrix renames it to `build-check (backend)`, `build-check (frontend)`…
# and the name the ruleset waits for never reports, leaving every pull request stuck on
# "Expected — waiting for status". Several images to build? LOOP inside this one job. `build-push`,
# further down, is NOT a required check — a matrix there is fine, and keeps the slow multi-arch
# builds parallel.

on:
  push:
    tags: ['v*']
  pull_request:
    # BOTH branches, not just main. WITH the `staging` capability the flow is feat/ -> develop ->
    # main, and the ruleset makes `build-check` a REQUIRED check on develop too. Listening on main
    # only would leave every PR into develop stuck forever on "Expected — waiting for status".
    # Harmless without `staging`: the branch simply never matches.
    branches: [main, develop]

permissions: {}

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # write the GHA layer cache
    env:
      TRIVY_VERSION: v0.72.0
      TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No Dockerfile yet (fresh scaffold)? The JOB must still run and go green: `build-check` is
      # a REQUIRED check, and a required check that never reports leaves the PR stuck forever on
      # "Expected — waiting for status". So the job stays, and only the steps are conditional.
      - name: No Dockerfile yet (scaffolded repo)
        if: hashFiles('Dockerfile') == ''
        run: echo "No Dockerfile yet — nothing to build or scan. These steps activate once it exists."
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: hashFiles('Dockerfile') != ''
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: hashFiles('Dockerfile') != ''
        with:
          context: .
          push: false
          load: true           # keep the image in the local daemon so Trivy can scan it
          tags: candidate:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Raw binary, NOT aquasecurity/trivy-action: in March 2026, 75 of that action's 76 tags were
      # force-pushed. Pinning the action by SHA would work too, but the binary + checksum is the
      # same discipline already used for gitleaks and actionlint — one pattern, not three.
      - name: Install Trivy (pinned + checksum-verified)
        if: hashFiles('Dockerfile') != ''
        run: |
          set -euo pipefail
          v="${TRIVY_VERSION#v}"   # the tag carries the `v`, the asset name does not
          f="trivy_${v}_Linux-64bit.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${f}"
          echo "${TRIVY_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" trivy
      - name: Scan the image (fails on CRITICAL/HIGH)
        if: hashFiles('Dockerfile') != ''
        run: |
          set -euo pipefail
          ./trivy image --scanners vuln --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 --no-progress candidate:pr

  build-push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write       # cosign keyless signing: the OIDC token IS the identity
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # QEMU: needed to build the arm64 image on an amd64 runner. Only on the PUBLISH job —
      # `build-check` stays amd64-only, so pull requests keep their short feedback loop.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/decantfi-collector
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          # The whole point of this capability is that SOMEONE ELSE deploys the image. A single
          # amd64 manifest means a Raspberry Pi or an Apple-silicon host gets
          # `no matching manifest for linux/arm64/v8` — a wall, with no warning, at `docker pull`.
          # Costs 2-4 min on release builds (QEMU emulation); costs nothing on pull requests.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM + SLSA provenance, attached to the manifest. Whoever deploys the image can then
          # answer "what is inside it, and what built it" WITHOUT trusting this repository — which
          # is the entire point of shipping an artefact someone else runs. Costs seconds.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: no private key to store or rotate. The signing identity IS this workflow's OIDC
      # token, recorded in Fulcio's transparency log — so a signature proves WHICH workflow of
      # WHICH repository built it, not merely that someone held a key.
      # ⚠ Signed BY DIGEST, never by tag: a tag can be re-pointed at another image afterwards,
      # and the deploying host verifies what it actually pulled.
      # Verify before deploying:
      #   cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp 'https://github.com/actarus314/DecantFi/' <image>:<tag>
      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/decantfi-collector
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # The GitHub Release lives HERE, not in release.yml, and that is the whole point: `needs` cannot
  # cross workflows. With the artefact capability the release ANNOUNCES an image — publishing it
  # before `build-push` succeeds would hand out a version pointing at an image that does not exist.
  # init-project.sh therefore ships release.yml ONLY for projects without this capability. Keeping
  # both and relying on the idempotency guard would NOT work: they start at the same time on the
  # tag, and whichever wins the race decides — which is exactly the bug, re-armed.
  release:
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The guard stays: pushing a tag twice, or re-running the workflow, must not fail.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — skipping."
            exit 0
          fi
          # Whoever deploys this reads the release, not the workflow: the notes carry the pinned
          # image reference. `--generate-notes` cannot prepend anything, so the notes are fetched
          # through the API and the image block is placed in front of them.
          notes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body)
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "## Image

          \`\`\`yaml
          image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/decantfi-collector:${GITHUB_REF_NAME#v}
          \`\`\`

          ${notes}"
